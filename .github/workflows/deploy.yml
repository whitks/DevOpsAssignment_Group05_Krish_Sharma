name: CD — Build & Deploy

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/whitks/devops-assignment-group05
  REGISTRY: ghcr.io

jobs:
  build-image:
    name: Build & push container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: tags
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DevOps/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-image
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: SSH into production host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker stop devops-app || true
            docker rm devops-app || true
            docker run -d --name devops-app -p 8080:3000 \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  notify:
    name: Notify team
    runs-on: ubuntu-latest
    needs: [build-image, deploy]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "Deployment finished."
          echo "Image: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}"